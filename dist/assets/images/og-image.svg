<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <!-- Warm background -->
  <rect width="1200" height="630" fill="#FAF7F2"/>
  
  <!-- Subtle decorative border & inner card -->
  <rect x="40" y="40" width="1120" height="550" rx="32" fill="#FFFFFF" stroke="#E8E2D9" stroke-width="2"/>
  
  <!-- Ambient background glow/circles -->
  <circle cx="1020" cy="180" r="180" fill="#FDF1EE" opacity="0.8"/>
  <circle cx="950" cy="420" r="140" fill="#FEF3C7" opacity="0.6"/>
  <circle cx="150" cy="500" r="100" fill="#F5EFEB" opacity="0.7"/>

  <!-- Brand Wordmark Header -->
  <g transform="translate(100, 100)">
    <!-- Chilli Logo -->
    <g transform="scale(1.8)">
      <path d="M17 3C17 3 18.5 6 15.5 8C14.5 8.7 13.2 9.1 12 9.5" stroke="#15803D" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M12.5 9.5C14.8 9.2 18.2 10.1 20 12.5C22.5 15.8 21.5 21.2 18.5 25C15.8 28.5 11.2 30 9.5 29.5C8.8 29.3 8.6 28.5 9 27.9C10.8 25.2 12.2 21.5 12.5 18C12.8 14.5 11.8 11.5 12.5 9.5Z" fill="#D93829"/>
      <path d="M14 13C15.5 14.2 16.8 16.5 16.5 19.5" stroke="#F87171" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 3"/>
    </g>
    <!-- Wordmark text -->
    <text x="75" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#1C1917" letter-spacing="-1">
      Oye <tspan fill="#D93829">Chilli</tspan>
    </text>
  </g>

  <!-- Studio pill tag -->
  <g transform="translate(100, 200)">
    <rect width="360" height="42" rx="21" fill="#FAF7F2" stroke="#E8E2D9" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="5" fill="#D93829"/>
    <text x="40" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#57534E">
      Independent Studio · Mumbai, India
    </text>
  </g>

  <!-- Hero Headline -->
  <text x="100" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="800" fill="#1C1917" letter-spacing="-1.5">
    A little spice. A lot of possibility.
  </text>

  <!-- Supporting Copy -->
  <text x="100" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="400" fill="#57534E">
    We make playful apps and useful digital tools for everyday life.
  </text>

  <!-- Products Pill Row -->
  <g transform="translate(100, 460)">
    <!-- Natkhat -->
    <g transform="translate(0, 0)">
      <rect width="210" height="52" rx="26" fill="#FDF1EE" stroke="#F7CBC4" stroke-width="1.5"/>
      <circle cx="28" cy="26" r="6" fill="#E05A47"/>
      <text x="46" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#1C1917">Natkhat</text>
    </g>

    <!-- huhu! -->
    <g transform="translate(230, 0)">
      <rect width="180" height="52" rx="26" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
      <circle cx="28" cy="26" r="6" fill="#D97706"/>
      <text x="46" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#1C1917">huhu!</text>
    </g>

    <!-- Pickal -->
    <g transform="translate(430, 0)">
      <rect width="180" height="52" rx="26" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
      <circle cx="28" cy="26" r="6" fill="#2563EB"/>
      <text x="46" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#1C1917">Pickal</text>
    </g>
  </g>

  <!-- Domain watermark in bottom right -->
  <text x="1060" y="525" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" fill="#78716C" text-anchor="end">
    oyechilli.com
  </text>
</svg>
